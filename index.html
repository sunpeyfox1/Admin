<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Console - Pro Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#070a0f] text-slate-100 font-sans min-h-screen pb-10 select-none flex flex-col justify-between">

  <!-- ADMIN HEADER -->
  <header class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md px-4 py-3 border-b border-slate-800/80 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <img src="t.png" alt="Logo" class="w-9 h-9 rounded-xl object-cover shadow-md border border-slate-700/50">
      <div>
        <h1 class="font-bold text-sm text-white tracking-wide">True Console</h1>
        <span class="text-[9px] text-amber-400 font-bold uppercase tracking-widest bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20">Super Admin</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-[11px] text-slate-300 font-semibold">Live System</span>
    </div>
  </header>

  <!-- ADMIN MAIN CONTENT -->
  <main class="p-4 max-w-lg mx-auto w-full space-y-4 fade-in">
    
    <!-- STATS CARDS -->
    <div class="grid grid-cols-3 gap-2.5">
      <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-2xl text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Pending</p>
        <h3 id="stat-pending" class="text-lg font-extrabold text-amber-400 mt-0.5">0</h3>
      </div>
      <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-2xl text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Approved</p>
        <h3 id="stat-approved" class="text-lg font-extrabold text-emerald-400 mt-0.5">0</h3>
      </div>
      <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-2xl text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Rejected</p>
        <h3 id="stat-rejected" class="text-lg font-extrabold text-red-400 mt-0.5">0</h3>
      </div>
    </div>
     <!-- TOTAL USERS CARD & LIST -->
<div class="glass-card p-4 rounded-2xl border border-slate-800 space-y-3">
  <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
    <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Registered Users</h3>
    <span id="stat-total-users" class="text-xs font-bold bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/20">0 Users</span>
  </div>
  <div id="users-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
    <p class="text-xs text-slate-500 text-center py-2">Loading users...</p>
  </div>
</div>

    <!-- SEARCH & FILTER BAR -->
    <div class="space-y-2.5">
      <div class="relative">
        <input type="text" id="search-input" oninput="renderApps()" placeholder="Search app, package or developer..." class="w-full bg-slate-900/90 border border-slate-800 text-xs text-white rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-indigo-500/60 transition shadow-inner">
        <span class="absolute left-3 top-2.5 text-xs text-slate-500">🔍</span>
      </div>
      
      <!-- STATUS TABS -->
      <div class="flex gap-2 text-xs p-1.5 bg-slate-950/90 border border-slate-800/80 rounded-xl">
        <button onclick="filterStatus('Pending')" id="tab-Pending" class="flex-1 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-400 font-bold text-center transition">Pending</button>
        <button onclick="filterStatus('Approved')" id="tab-Approved" class="flex-1 py-1.5 rounded-lg border border-transparent bg-slate-900/50 text-slate-400 font-medium text-center transition hover:bg-slate-800">Approved</button>
        <button onclick="filterStatus('Rejected')" id="tab-Rejected" class="flex-1 py-1.5 rounded-lg border border-transparent bg-slate-900/50 text-slate-400 font-medium text-center transition hover:bg-slate-800">Rejected</button>
      </div>
    </div>

    <!-- QUEUE TITLE -->
    <div class="flex items-center justify-between pt-1">
      <h2 id="queue-title" class="text-xs font-bold text-slate-300 uppercase tracking-wider">Pending Applications</h2>
      <span class="text-[10px] text-slate-500 font-medium">Realtime Firestore</span>
    </div>

    <!-- APP REVIEW CARD LIST -->
    <div id="review-list" class="space-y-3.5">
      <div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800">
        লোডিং ডাটা...
      </div>
    </div>

  </main>

  <footer class="text-center text-[10px] text-slate-600 py-4">
    True Console Admin Panel v2.0.0 Pro
  </footer>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnxRidYI_cL75x4JKFjdbDSsTNrenLzBs",
      authDomain: "may-fist-app.firebaseapp.com",
      projectId: "may-fist-app",
      storageBucket: "may-fist-app.firebasestorage.app",
      messagingSenderId: "29389027661",
      appId: "1:29389027661:web:7b3c5d39207c415af2df04",
      measurementId: "G-VGWLQQHQE8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allAppsData = [];
    let currentFilterStatus = 'Pending';

    const appsRef = collection(db, "apps");
    const q = query(appsRef, orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
      allAppsData = [];
      let pCount = 0, aCount = 0, rCount = 0;

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const item = { id: docSnap.id, ...data };
        allAppsData.push(item);

        const st = item.status || 'Pending';
        if (st === 'Approved') aCount++;
        else if (st === 'Rejected') rCount++;
        else pCount++;
      });

      if(document.getElementById('stat-pending')) document.getElementById('stat-pending').innerText = pCount;
      if(document.getElementById('stat-approved')) document.getElementById('stat-approved').innerText = aCount;
      if(document.getElementById('stat-rejected')) document.getElementById('stat-rejected').innerText = rCount;

      renderApps();
    });

    window.filterStatus = function(status) {
      currentFilterStatus = status;
      ['Pending', 'Approved', 'Rejected'].forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if(s === status) {
          btn.className = `flex-1 py-1.5 rounded-lg border font-bold text-center transition shadow-sm ${
            s === 'Approved' ? 'border-emerald-500/40 bg-emerald-500/15 text-emerald-400' :
            s === 'Rejected' ? 'border-red-500/40 bg-red-500/15 text-red-400' :
            'border-amber-500/40 bg-amber-500/15 text-amber-400'
          }`;
        } else {
          btn.className = 'flex-1 py-1.5 rounded-lg border border-transparent bg-slate-900/50 text-slate-400 font-medium text-center transition hover:bg-slate-800';
        }
      });
      document.getElementById('queue-title').innerText = `${status} Applications`;
      renderApps();
    };

    window.renderApps = function() {
      const container = document.getElementById("review-list");
      const searchVal = (document.getElementById("search-input")?.value || "").toLowerCase();

      const filtered = allAppsData.filter(item => {
        const matchStatus = (item.status || 'Pending') === currentFilterStatus;
        const matchSearch = (item.appName || '').toLowerCase().includes(searchVal) || 
                            (item.packageName || '').toLowerCase().includes(searchVal) ||
                            (item.developerEmail || '').toLowerCase().includes(searchVal);
        return matchStatus && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800/80">কোনো অ্যাপ পাওয়া যায়নি।</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="glass-card border border-slate-800/90 rounded-2xl p-4 space-y-3.5 shadow-xl relative overflow-hidden">
          
          <!-- TOP APPS INFO -->
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <img src="${item.iconUrl || 't.png'}" alt="Icon" class="w-12 h-12 bg-slate-950 border border-slate-800 rounded-xl object-cover shadow">
              <div>
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                  ${item.appName || 'Unknown App'}
                </h3>
                <p class="text-[11px] text-slate-400 font-mono mt-0.5">${item.packageName || 'com.example.app'}</p>
                <div class="mt-1.5 flex items-center gap-1.5">
                  <span class="px-2 py-0.5 text-[9px] rounded-md font-semibold ${
                    item.status === 'Approved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' :
                    item.status === 'Rejected' ? 'bg-red-500/10 text-red-400 border border-red-500/30' :
                    'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                  }">${item.status || 'Pending'}</span>
                  <span class="px-2 py-0.5 text-[9px] rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">${item.category || 'General'}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- LINKS & RESOURCE DETAILS BOX -->
          <div class="p-3 bg-slate-950/70 border border-slate-800/90 rounded-xl text-[11px] space-y-2 text-slate-300">
            ${item.developerEmail ? `<div class="flex justify-between items-center"><span class="text-slate-500">Developer:</span> <span class="font-mono text-slate-300">${item.developerEmail}</span></div>` : ''}
            
            <!-- GITHUB & DOWNLOAD LINKS BAR -->
            <div class="pt-1 flex flex-wrap gap-2">
              ${item.sourceLink || item.githubLink ? `
                <a href="${item.sourceLink || item.githubLink}" target="_blank" class="flex-1 min-w-[120px] py-1.5 px-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-400 rounded-lg text-center font-medium flex items-center justify-center gap-1.5 transition">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                  <span>GitHub / Source</span>
                </a>
              ` : '<span class="text-slate-500 text-[10px]">No Source Link</span>'}

              ${item.apkUrl || item.downloadUrl ? `
                <a href="${item.apkUrl || item.downloadUrl}" target="_blank" class="flex-1 min-w-[120px] py-1.5 px-2.5 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 rounded-lg text-center font-medium flex items-center justify-center gap-1.5 transition">
                  <span>📥 APK Download</span>
                </a>
              ` : ''}
            </div>
          </div>

          <!-- ACTION BUTTONS -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            ${item.status !== 'Rejected' ? `
              <button onclick="updateStatus('${item.id}', 'Rejected')" class="py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-bold rounded-xl text-xs transition">❌ Reject</button>
            ` : ''}
            ${item.status !== 'Approved' ? `
              <button onclick="updateStatus('${item.id}', 'Approved')" class="py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition shadow-md shadow-emerald-600/20">✔ Approve</button>
            ` : ''}
            <button onclick="deleteAppRecord('${item.id}')" class="col-span-2 py-1.5 bg-slate-900 hover:bg-red-950/40 text-slate-400 hover:text-red-400 border border-slate-800 font-medium rounded-xl text-[11px] transition">🗑 Permanently Delete</button>
          </div>
        </div>
      `).join('');
    };

    window.updateStatus = async function(appId, newStatus) {
      try {
        await updateDoc(doc(db, "apps", appId), { status: newStatus });
      } catch (err) {
        alert("Error: " + err.message);
      }
    };

    window.deleteAppRecord = async function(appId) {
      if (confirm("আপনি কি নিশ্চিত যে এই অ্যাপটি স্থায়ীভাবে মুছে ফেলতে চান?")) {
        try {
          await deleteDoc(doc(db, "apps", appId));
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    };
    // Admin Panel - Fetch Users from Firebase Realtime Database
const usersRef = firebase.database().ref('users');
usersRef.on('value', (snapshot) => {
  const data = snapshot.val();
  const container = document.getElementById('users-list');
  const totalUsersText = document.getElementById('stat-total-users');
  
  if (container) {
    container.innerHTML = '';
    if (data) {
      const userKeys = Object.keys(data);
      if (totalUsersText) totalUsersText.innerText = `${userKeys.length} Users`;

      userKeys.forEach((key) => {
        const u = data[key];
        container.innerHTML += `
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900/50 border border-slate-800/50">
            <div class="flex items-center gap-2.5">
              <img src="${u.photo || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full object-cover border border-slate-700">
              <div>
                <p class="font-bold text-xs text-slate-200">${u.name || 'User'}</p>
                <p class="text-[10px] text-slate-400">${u.email || ''}</p>
              </div>
            </div>
            <span class="text-[9px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">Active</span>
          </div>
        `;
      });
    } else {
      if (totalUsersText) totalUsersText.innerText = '0 Users';
      container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">No users registered yet.</p>';
    }
  }
});

  </script>
  
</body>
</html>
